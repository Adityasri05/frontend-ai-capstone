<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
      .logo-icon-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #0f172a;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .logo-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 1.5px;
        fill: #0f172a;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Geometric Icon Box -->
  <rect x="5" y="5" width="40" height="40" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <text x="25" y="25" class="logo-icon-text">AS</text>
  <!-- Brand Text -->
  <text x="60" y="25" class="logo-text">ADITYA SRIVASTAV</text>
</svg>
