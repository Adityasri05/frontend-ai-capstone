<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>
  
  <!-- Grid Lines -->
  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M 300,0 L 300,630 M 600,0 L 600,630 M 900,0 L 900,630" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1"/>
  
  <!-- Wave Field Representation -->
  <path d="M 100,320 Q 300,250 600,320 T 1100,320" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 100,340 Q 400,400 700,300 T 1100,350" stroke="#2563eb" stroke-opacity="0.5" stroke-width="2.5" fill="none"/>

  <!-- Content Card overlay -->
  <rect x="250" y="140" width="700" height="350" rx="24" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
  
  <text x="600" y="210" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">AVAILABLE FOR JUNIOR FRONTEND AI ROLES • 2026</text>
  <text x="600" y="270" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="44" font-weight="800">Aditya Srivastav</text>
  <text x="600" y="320" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="500">Frontend Engineer Building AI-Powered Interfaces</text>
  
  <!-- CTA Buttons -->
  <rect x="420" y="375" width="170" height="48" rx="12" fill="#2563eb"/>
  <text x="505" y="405" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Connect LinkedIn ↗</text>

  <rect x="610" y="375" width="170" height="48" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="695" y="405" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">View Selected Work ↓</text>
</svg>
